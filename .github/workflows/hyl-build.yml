name: HYL FakeTCP Validation Build

on:
  workflow_dispatch:
  push:
    branches: [hyl-faketcp-validation]
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: hyl-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HYL_NIGHTLY_SHA: 99db92a3aeb3109efe1ace5a4a3e2a1bf3840ed7
  HYL_PATCH_SHA: 6649c35aea3769a7f1704a4ae1fe564e4f2077a9
  HYL_BASELINE_SHA: 1624c81d9f47e841fcb6828958874037194eb476
  HYL_VALIDATION_PATCH_SHA: 4c0a313ad15d0d12c91999648c96cdb489dd7c1b
  HYL_RECONNECT_BASELINE_SHA: e7f8f27ed561457c52912395f0df625377fe198d

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    if: github.repository == 'xorryk/EasyTier-HYL'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            allocator: mimalloc
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            allocator: mimalloc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      HYL_PLATFORM: ${{ matrix.platform }}
      HYL_RELEASE_TAG: hyl-validation-20261022-r${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify nightly ancestry and patch provenance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HYL_NIGHTLY_SHA" HEAD
          git log --format=%B "$HYL_NIGHTLY_SHA"..HEAD | grep -F "$HYL_PATCH_SHA"
          git merge-base --is-ancestor "$HYL_BASELINE_SHA" HEAD
          git log --format=%B "$HYL_BASELINE_SHA"..HEAD | grep -F "$HYL_VALIDATION_PATCH_SHA"
          git merge-base --is-ancestor "$HYL_RECONNECT_BASELINE_SHA" HEAD

      - name: Prepare upstream build tools and frontend
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          gui: true
          pnpm: true
          pnpm-build-filter: easytier-gui...
          token: ${{ github.token }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hyl-release-${{ matrix.target }}
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make Windows runtime DLLs available to tests and version checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Join-Path $env:GITHUB_WORKSPACE 'easytier/third_party/x86_64' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Rust formatting
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

      - name: Test IPv4 and IPv6 connector socket selection
        run: >-
          cargo test --locked --target "$TARGET"
          --package easytier --features ${{ matrix.allocator }}
          --lib connector_uses_ -- --nocapture

      - name: Test listener address changes, payload delivery, reconnect and capture cleanup
        run: >-
          cargo test --locked --target "$TARGET"
          --package easytier --features ${{ matrix.allocator }}
          --lib listener_address_change_ -- --nocapture

      - name: Test FakeTCP buffer configuration round trips and runtime propagation
        run: >-
          cargo test --locked --target "$TARGET"
          --package easytier-core --features browser-config
          --lib faketcp_bpf_buffer -- --nocapture

      - name: Test receive buffer form persistence
        working-directory: easytier-web/frontend-lib
        run: pnpm exec vitest run --config vitest.config.ts tests/config-ui.spec.ts

      - name: Test FakeTCP ACK, SACK, zero-fill filtering and real connection closure
        run: >-
          cargo test --locked --target "$TARGET"
          --package easytier --features ${{ matrix.allocator }}
          --lib socket::fake_tcp::stack::tests -- --nocapture

      - name: Test framed transport still rejects invalid packets
        run: >-
          cargo test --locked --target "$TARGET"
          --package easytier-core --features browser-config
          --lib tunnel::framed::tests -- --nocapture

      - name: Verify validation comparison guide is included
        run: test -s HYL-VALIDATION.md

      - name: Verify Darwin BPF ABI and batched record parsing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hyl-bpf-abi.c" <<'EOF'
          #include <net/bpf.h>
          #include <stddef.h>
          _Static_assert(BPF_ALIGNMENT == 4, "Darwin BPF alignment changed");
          _Static_assert(BPF_WORDALIGN(98) == 100, "Darwin BPF record padding changed");
          _Static_assert(offsetof(struct bpf_hdr, bh_caplen) == 8, "BPF timestamp layout changed");
          _Static_assert(offsetof(struct bpf_hdr, bh_hdrlen) == 16, "BPF header layout changed");
          int main(void) { return 0; }
          EOF
          clang -std=c11 -Wall -Werror "$RUNNER_TEMP/hyl-bpf-abi.c" -o "$RUNNER_TEMP/hyl-bpf-abi"
          "$RUNNER_TEMP/hyl-bpf-abi"
          cargo test --locked --target "$TARGET" --package easytier \
            --features ${{ matrix.allocator }} --lib macos_bpf::tests -- --nocapture

      - name: Verify configurable BPF sizes on a real Darwin descriptor
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo test --locked --target "$TARGET" --package easytier \
            --features ${{ matrix.allocator }} --lib --no-run --message-format=json \
            > "$RUNNER_TEMP/hyl-test-artifacts.jsonl"
          TEST_BINARY=$(python -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; matches=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("profile",{}).get("test") and r.get("target",{}).get("name")=="easytier" and r.get("executable")]; assert len(matches)==1,matches; print(matches[0])' "$RUNNER_TEMP/hyl-test-artifacts.jsonl")
          sudo "$TEST_BINARY" bpf_receive_buffer_negotiates_with_darwin --ignored --nocapture

      - name: Build Core and CLI
        run: >-
          cargo build --locked --release --target "$TARGET"
          --package easytier --features ${{ matrix.allocator }}
          --bin easytier-core --bin easytier-cli

      - name: Include Windows network drivers
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          find easytier/third_party/x86_64 -maxdepth 1 -type f \( -name '*.dll' -o -name '*.sys' \) -exec cp {} easytier-gui/src-tauri/ \;
          test -f easytier-gui/src-tauri/WinDivert64.sys
          test -f easytier-gui/src-tauri/wintun.dll

      - name: Build Windows GUI installer
        if: runner.os == 'Windows'
        working-directory: easytier-gui
        run: pnpm tauri build --target "$TARGET" --bundles nsis -- --locked

      - name: Build macOS GUI DMG with ad-hoc signing
        if: runner.os == 'macOS'
        working-directory: easytier-gui
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --target "$TARGET" --bundles app,dmg -- --locked

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "target/$TARGET/release/bundle/macos/easytier-gui.app"

      - name: Package binaries and record provenance
        run: >-
          python script/hyl/package.py --target "$TARGET"
          --platform "$HYL_PLATFORM" --release "$HYL_RELEASE_TAG"

      - uses: actions/upload-artifact@v5
        with:
          name: hyl-${{ matrix.platform }}
          path: dist/hyl/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish validation prerelease after automated checks
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: hyl-validation-20261022-r${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: hyl-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete artifact set and calculate checksums
        run: |
          set -euo pipefail
          python script/hyl/package.py --verify-directory release-assets
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish downloadable prerelease
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "EasyTier HYL - FakeTCP IPv6 reconnect test.2 (build $GITHUB_RUN_NUMBER)" \
              --notes-file HYL-RELEASE-NOTES.md --prerelease
          fi
